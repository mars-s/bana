[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# legacy: the old egui front end, kept as a porting reference, not built (see legacy/egui/README.md).
# apps/tanacraft-ios: the SwiftUI iPhone app (Xcode, not cargo); its engine is crates/ffi.
exclude = ["legacy", "apps/tanacraft-ios"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
tanacraft-core = { path = "crates/core" }
tanacraft-commands = { path = "crates/commands" }
tanacraft-mcp = { path = "crates/mcp" }
tanacraft-server = { path = "crates/server" }

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
