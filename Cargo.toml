[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
tanacraft-core = { path = "crates/core" }
tanacraft-commands = { path = "crates/commands" }
tanacraft-mcp = { path = "crates/mcp" }
tanacraft-ui-egui = { path = "crates/ui-egui" }

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
