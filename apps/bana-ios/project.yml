# xcodegen spec for the iPhone app: `xcodegen generate` writes Bana.xcodeproj.
# The engine (Core/BanaCore.xcframework and Core/Generated/bana_ffi.swift) comes from
# ../../scripts/build-ios-core.sh; run it first.
name: Bana
options:
  bundleIdPrefix: org.bana
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Bana:
    type: application
    platform: iOS
    sources:
      - path: Bana
      - path: Core/Generated
    # Merged with the generated Info.plist: what has no INFOPLIST_KEY_ setting (arrays).
    info:
      path: Bana/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.bana.app.sync]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - framework: Core/BanaCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bana.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Bana
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the sync code your computer shows, to pair this iPhone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
  BanaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BanaUITests
    dependencies:
      - target: Bana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bana.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bana
schemes:
  Bana:
    build:
      targets:
        Bana: all
        BanaUITests: [test]
    test:
      targets:
        - BanaUITests
