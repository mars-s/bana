# xcodegen spec for the iPhone app: `xcodegen generate` writes TanaCraft.xcodeproj.
# The engine (Core/TanaCraftCore.xcframework and Core/Generated/tanacraft_ffi.swift) comes from
# ../../scripts/build-ios-core.sh; run it first.
name: TanaCraft
options:
  bundleIdPrefix: dev.tanacraft
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  TanaCraft:
    type: application
    platform: iOS
    sources:
      - path: TanaCraft
      - path: Core/Generated
    dependencies:
      - framework: Core/TanaCraftCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tanacraft.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: TanaCraft
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
  TanaCraftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TanaCraftUITests
    dependencies:
      - target: TanaCraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tanacraft.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TanaCraft
schemes:
  TanaCraft:
    build:
      targets:
        TanaCraft: all
        TanaCraftUITests: [test]
    test:
      targets:
        - TanaCraftUITests
