[package]
name = "bana-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bana node graph: nodes, supertags, fields, references, daily notes, trash, undo, persistence"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
loro = "1"
# Regular expressions in searches (UC-06.41): linear time, so a hostile pattern cannot stall.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
