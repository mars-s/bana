[package]
name = "bana-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Bana engine for Swift (UniFFI): open a graph, run commands, read view snapshots, hear about changes"

# No `[lints] workspace = true`: the workspace forbids unsafe code, and UniFFI's generated
# scaffolding is the one place that needs it (it allows it itself).

[lib]
name = "bana_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
bana-core = { workspace = true }
bana-commands = { workspace = true }
bana-server = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uniffi = "0.29"
